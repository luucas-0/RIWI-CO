services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bd_lucas_mortigo_clan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_lucas_mortigo_clan"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      PORT: 4000
      POSTGRES_URL: postgresql://rw_app:rw_app@db:5432/bd_lucas_mortigo_clan
      JWT_SECRET: ${JWT_SECRET:-local-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-refresh-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_API_URL: http://localhost:4000 } }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
